<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP / Elite Profile Header</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --app-bg:#0b0b0d;
    --app-line:#1e1e22;
    --gold-1:#f6c453; --gold-2:#fff3c4; --gold-3:#b8860b;
    --elite-1:#7ee8fa; --elite-2:#a78bfa; --elite-3:#f472b6;
  }
  @property --a { syntax:'<angle>'; initial-value:0deg; inherits:false; }
  body { background:#060609; font-family:'Outfit',sans-serif; color:#e7e7ef; display:flex; flex-direction:column; align-items:center; padding:40px 20px; gap:20px; }

  /* ===== TIER SWITCHER (for testing) ===== */
  .tier-switch { display:flex; gap:8px; background:#10101a; border:1px solid #1e1e2e; padding:6px; border-radius:999px; }
  .tier-switch button { font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; padding:10px 22px; border-radius:999px; border:none; background:transparent; color:#8b8b9e; transition:.25s; }
  .tier-switch button.active.free  { background:#26262f; color:#fff; }
  .tier-switch button.active.vip   { background:linear-gradient(120deg,var(--gold-3),var(--gold-1)); color:#1a1200; }
  .tier-switch button.active.elite { background:linear-gradient(120deg,var(--elite-1),var(--elite-2),var(--elite-3)); color:#12061f; }

  /* ===== PROFILE CONTAINER ===== */
  .profile-wrap { background:var(--app-bg); border-radius:24px; padding:28px 24px; width:100%; max-width:400px; border:1px solid #232330; }

  /* ===== PROFILE HEADER (centered, stacked) ===== */
  .p-head {
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:14px;
  }

  .avatar-box {
    position:relative;
    width:120px;
    height:120px;
    flex-shrink:0;
  }

  /* ===== RING ===== */
  .avatar-ring {
    position:absolute; inset:0; border-radius:50%;
  }
  .avatar-ring::before {
    content:''; position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 200deg, #ff5f6d, #ffc371, #ff5f6d);
  }
  [data-tier="vip"] .avatar-ring {
    animation:spinA 4.5s linear infinite;
    filter:drop-shadow(0 0 14px rgba(246,196,83,.6));
  }
  [data-tier="vip"] .avatar-ring::before {
    background:conic-gradient(from var(--a), var(--gold-1), var(--gold-2), var(--gold-3), #ffe9a8, var(--gold-1));
  }
  [data-tier="elite"] .avatar-ring {
    animation:spinA 3s linear infinite;
    filter:drop-shadow(0 0 16px rgba(167,139,250,.65));
  }
  [data-tier="elite"] .avatar-ring::before {
    background:conic-gradient(from var(--a), var(--elite-1), var(--elite-2), var(--elite-3), #fff, var(--elite-1));
  }
  @keyframes spinA { to { --a:360deg; } }
  .avatar-ring::after {
    content:''; position:absolute; inset:4px; border-radius:50%; background:var(--app-bg);
  }

  /* ===== GLOW LAYERS ===== */
  .ring-glow {
    position:absolute; inset:-8px; border-radius:50%; opacity:0; pointer-events:none;
  }
  [data-tier="vip"] .ring-glow {
    opacity:1;
    background:radial-gradient(circle, rgba(246,196,83,.3) 0%, transparent 70%);
    animation:breathGlow 2.5s ease-in-out infinite;
  }
  @keyframes breathGlow {
    0%,100% { transform:scale(1); opacity:.4; }
    50% { transform:scale(1.1); opacity:.75; }
  }

  .ring-pulse {
    position:absolute; inset:-10px; border-radius:50%; opacity:0; pointer-events:none;
  }
  [data-tier="elite"] .ring-pulse {
    opacity:1;
    background:radial-gradient(circle, rgba(167,139,250,.25) 0%, rgba(126,232,250,.15) 40%, transparent 70%);
    animation:prismPulse 2s ease-in-out infinite;
  }
  @keyframes prismPulse {
    0%,100% { transform:scale(1); opacity:.3; filter:hue-rotate(0deg); }
    50% { transform:scale(1.12); opacity:.65; filter:hue-rotate(30deg); }
  }

  /* ===== SATELLITE ORBITS ===== */
  .orbit-track {
    position:absolute; inset:-22px; border-radius:50%; opacity:0; pointer-events:none;
  }
  [data-tier="vip"] .orbit-track,
  [data-tier="elite"] .orbit-track { opacity:1; }

  .satellite {
    position:absolute; width:6px; height:6px; border-radius:50%;
    top:50%; left:50%; transform-origin:center center;
  }
  [data-tier="vip"] .satellite {
    background:var(--gold-1);
    box-shadow:0 0 8px 2px rgba(246,196,83,.7), 0 0 16px 3px rgba(246,196,83,.25);
  }
  [data-tier="vip"] .satellite:nth-child(1) { animation:orbit1 5s linear infinite; }
  [data-tier="vip"] .satellite:nth-child(2) { animation:orbit2 5s linear infinite; animation-delay:-1.66s; }
  [data-tier="vip"] .satellite:nth-child(3) { animation:orbit3 5s linear infinite; animation-delay:-3.33s; }

  [data-tier="elite"] .satellite {
    width:5px; height:5px;
    box-shadow:0 0 8px 2px rgba(167,139,250,.7), 0 0 16px 3px rgba(126,232,250,.25);
  }
  [data-tier="elite"] .satellite:nth-child(1) { background:var(--elite-1); animation:orbit1 3.5s linear infinite; }
  [data-tier="elite"] .satellite:nth-child(2) { background:var(--elite-2); animation:orbit2 3.5s linear infinite; animation-delay:-1.16s; }
  [data-tier="elite"] .satellite:nth-child(3) { background:var(--elite-3); animation:orbit3 3.5s linear infinite; animation-delay:-2.33s; }

  @keyframes orbit1 {
    0%   { transform:rotate(0deg)   translateX(68px) rotate(0deg); }
    100% { transform:rotate(360deg) translateX(68px) rotate(-360deg); }
  }
  @keyframes orbit2 {
    0%   { transform:rotate(120deg)   translateX(68px) rotate(-120deg); }
    100% { transform:rotate(480deg) translateX(68px) rotate(-480deg); }
  }
  @keyframes orbit3 {
    0%   { transform:rotate(240deg)   translateX(68px) rotate(-240deg); }
    100% { transform:rotate(600deg) translateX(68px) rotate(-600deg); }
  }

  /* ===== AVATAR INNER ===== */
  .avatar {
    position:absolute; inset:9px; border-radius:50%;
    background:linear-gradient(135deg,#c026d3,#7c3aed);
    display:grid; place-items:center;
    font-size:42px; font-weight:900; color:#fff;
    z-index:2; overflow:hidden;
  }
  .edit-dot {
    position:absolute; bottom:2px; right:2px;
    width:26px; height:26px; border-radius:50%;
    background:#26262f; border:2.5px solid var(--app-bg);
    display:grid; place-items:center; z-index:4; cursor:pointer;
  }
  .edit-dot svg { width:12px; height:12px; color:#c9c9d8; }

  /* ===== VIP "VIP" TEXT OVERLAY ===== */
  .vip-text-overlay {
    position:absolute;
    top:-14px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; justify-content:center; gap:2px;
    z-index:5; pointer-events:none;
    opacity:0;
  }
  [data-tier="vip"] .vip-text-overlay { opacity:1; }
  .vip-text-overlay .vip-letter {
    display:inline-block;
    font-size:13px; font-weight:900; letter-spacing:1.5px;
    color:var(--gold-1);
    text-shadow:0 0 10px rgba(246,196,83,.7), 0 2px 6px rgba(0,0,0,.6);
    opacity:0;
    transform:translateY(16px);
  }
  [data-tier="vip"] .vip-text-overlay .vip-letter {
    animation:vipLetterRise .7s cubic-bezier(.2,1.4,.4,1) forwards,
              vipShimmer 2.5s ease-in-out infinite;
  }
  .vip-text-overlay .vip-letter:nth-child(1) { animation-delay:0s, 1.0s; }
  .vip-text-overlay .vip-letter:nth-child(2) { animation-delay:.12s, 1.12s; }
  .vip-text-overlay .vip-letter:nth-child(3) { animation-delay:.24s, 1.24s; }

  @keyframes vipLetterRise {
    0% { opacity:0; transform:translateY(16px); }
    100% { opacity:1; transform:translateY(0); }
  }
  @keyframes vipShimmer {
    0%,100% { text-shadow:0 0 10px rgba(246,196,83,.7), 0 2px 6px rgba(0,0,0,.6); }
    50% { text-shadow:0 0 20px rgba(255,243,196,.95), 0 0 30px rgba(246,196,83,.5), 0 2px 6px rgba(0,0,0,.6); }
  }

  /* ===== ELITE "PRO" TEXT OVERLAY ===== */
  .elite-text-overlay {
    position:absolute;
    top:-14px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; justify-content:center; gap:2px;
    z-index:5; pointer-events:none;
    opacity:0;
  }
  [data-tier="elite"] .elite-text-overlay { opacity:1; }
  .elite-text-overlay .pro-letter {
    display:inline-block;
    font-size:13px; font-weight:900; letter-spacing:1.5px;
    background:linear-gradient(90deg, var(--elite-1), var(--elite-3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0;
    transform:translateY(16px);
  }
  [data-tier="elite"] .elite-text-overlay .pro-letter {
    animation:proLetterRise .7s cubic-bezier(.2,1.4,.4,1) forwards,
              proShimmer 2.5s ease-in-out infinite;
  }
  .elite-text-overlay .pro-letter:nth-child(1) { animation-delay:0s, 1.0s; }
  .elite-text-overlay .pro-letter:nth-child(2) { animation-delay:.12s, 1.12s; }
  .elite-text-overlay .pro-letter:nth-child(3) { animation-delay:.24s, 1.24s; }

  @keyframes proLetterRise {
    0% { opacity:0; transform:translateY(16px); }
    100% { opacity:1; transform:translateY(0); }
  }
  @keyframes proShimmer {
    0%,100% { filter:brightness(1); }
    50% { filter:brightness(1.5) drop-shadow(0 0 8px rgba(167,139,250,.6)); }
  }

  /* ===== SPARKLES (Elite only) ===== */
  .sparkles {
    position:absolute; inset:-16px; pointer-events:none; z-index:3;
    opacity:0;
  }
  [data-tier="elite"] .sparkles { opacity:1; }
  .sparkles i {
    position:absolute; width:5px; height:5px; border-radius:50%; background:#fff;
    box-shadow:0 0 8px 2px rgba(255,255,255,.7);
    animation:twinkle 2.2s ease-in-out infinite;
  }
  .sparkles i:nth-child(1){ top:4%; left:22%; animation-delay:0s; background:var(--elite-1); }
  .sparkles i:nth-child(2){ top:16%; right:4%; animation-delay:.6s; background:var(--elite-3); }
  .sparkles i:nth-child(3){ bottom:8%; left:2%; animation-delay:1.1s; background:var(--elite-2); }
  .sparkles i:nth-child(4){ bottom:2%; right:16%; animation-delay:1.5s; background:#fff; }
  @keyframes twinkle {
    0%,100%{ transform:scale(.4); opacity:.2 }
    50%{ transform:scale(1.25); opacity:1 }
  }

  /* ===== PROFILE INFO ===== */
  .p-id { text-align:center; }
  .p-namerow {
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .p-name { font-size:22px; font-weight:800; color:#fff; }
  .p-name .pen { width:14px; height:14px; color:#6d6d82; vertical-align:2px; margin-left:4px; }

  /* ===== BADGES ===== */
  .badge {
    position:relative; overflow:hidden;
    display:inline-flex; align-items:center; gap:4px;
    font-size:10px; font-weight:900; letter-spacing:1.2px;
    padding:5px 12px 5px 8px; border-radius:999px;
  }
  .badge svg { width:12px; height:12px; }
  .badge.vip {
    background:linear-gradient(120deg,#8a6108,var(--gold-1) 45%,#8a6108);
    color:#1c1300;
    box-shadow:0 3px 14px rgba(246,196,83,.45);
    display:none;
  }
  .badge.elite {
    background:linear-gradient(120deg,var(--elite-1),var(--elite-2) 50%,var(--elite-3));
    color:#150826;
    box-shadow:0 3px 16px rgba(167,139,250,.5);
    display:none;
  }
  [data-tier="vip"] .badge.vip, [data-tier="elite"] .badge.elite {
    display:inline-flex;
    animation:badgePop .5s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes badgePop {
    from{ transform:scale(.4) translateY(4px); opacity:0 }
    to{ transform:scale(1) translateY(0); opacity:1 }
  }
  .badge::after {
    content:''; position:absolute; top:0; left:-70%; width:45%; height:100%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.75),transparent);
    transform:skewX(-20deg);
    animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine { 0%{left:-70%} 55%{left:140%} 100%{left:140%} }

  .p-handle { font-size:13px; color:#8b8b9e; font-weight:500; margin-top:6px; }
  .p-ref { font-size:12px; margin-top:4px; font-weight:700; color:var(--gold-1); letter-spacing:.3px; }
  .elite-tagline {
    display:none; margin-top:6px; font-size:11px; font-weight:700;
    background:linear-gradient(90deg,var(--elite-1),var(--elite-3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  [data-tier="elite"] .elite-tagline { display:block; }

  .divider { height:1px; background:var(--app-line); margin:16px 0; }
</style>
</head>
<body>

<!-- TIER SWITCHER (test korar jonno, app e lage na) -->
<div class="tier-switch" id="tierSwitch">
  <button data-t="free" class="free active">FREE</button>
  <button data-t="vip" class="vip">VIP</button>
  <button data-t="elite" class="elite">ELITE</button>
</div>

<!-- ===== PROFILE HEADER COMPONENT ===== -->
<!-- Parent e data-tier="free" / "vip" / "elite" set korle hobe -->
<div class="profile-wrap" id="profileWrap" data-tier="free">
  <div class="p-head">
    <div class="avatar-box">
      <!-- Glow layers -->
      <div class="ring-glow"></div>
      <div class="ring-pulse"></div>

      <!-- Rotating ring -->
      <div class="avatar-ring"></div>

      <!-- Orbiting satellites -->
      <div class="orbit-track">
        <div class="satellite"></div>
        <div class="satellite"></div>
        <div class="satellite"></div>
      </div>

      <!-- VIP text on top -->
      <div class="vip-text-overlay">
        <span class="vip-letter">V</span>
        <span class="vip-letter">I</span>
        <span class="vip-letter">P</span>
      </div>

      <!-- ELITE text on top -->
      <div class="elite-text-overlay">
        <span class="pro-letter">P</span>
        <span class="pro-letter">R</span>
        <span class="pro-letter">O</span>
      </div>

      <!-- Avatar inner -->
      <div class="avatar">N</div>

      <!-- Sparkles (Elite only) -->
      <div class="sparkles"><i></i><i></i><i></i><i></i></div>

      <!-- Edit dot -->
      <div class="edit-dot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M17 3a2.8 2.8 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
      </div>
    </div>

    <!-- Info -->
    <div class="p-id">
      <div class="p-namerow">
        <span class="p-name">
          Nahiyan
          <svg class="pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M17 3a2.8 2.8 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
          </svg>
        </span>
        <!-- VIP Badge -->
        <span class="badge vip">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 4 5-6 5 6 4-4v9a1 1 0 01-1 1H4a1 1 0 01-1-1V8z"/></svg>
          VIP
        </span>
        <!-- Elite Badge -->
        <span class="badge elite">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 9l10 13L22 9l-10-7z"/></svg>
          ELITE
        </span>
      </div>
      <div class="p-handle">nahiyansheikh2@gmail.com</div>
      <div class="p-ref">Referral: ADCC83B4</div>
      <div class="elite-tagline">✦ Top 1% member · Founding Elite ✦</div>
    </div>
  </div>
</div>

<script>
  // Tier switch logic — app e tomar existing logic diye replace koro
  const wrap = document.getElementById('profileWrap');
  document.getElementById('tierSwitch').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    wrap.dataset.tier = b.dataset.t;
    document.querySelectorAll('#tierSwitch button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.t === b.dataset.t);
      btn.classList.toggle(btn.dataset.t, btn.dataset.t === b.dataset.t);
    });
  });
</script>

</body>
</html>
