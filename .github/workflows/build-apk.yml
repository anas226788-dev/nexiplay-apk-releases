name: Build NexiPlay APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      JAVA_OPTS: "-Xmx4096m"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Ensure gradle.properties
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          EOF

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Ensure google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "460195771831",
              "project_id": "nexiplay-app",
              "storage_bucket": "nexiplay-app.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:460195771831:android:c41a5f3bbc86144bb16432",
                  "android_client_info": {
                    "package_name": "com.nexiplay.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyADFzx0DmfsrAeN8tx7Ys-EWsgnZJFceCU"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Release APK
        if: "${{ github.event_name == 'push' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}"
        run: ./gradlew assembleRelease --stacktrace --no-daemon --max-workers=2

      - name: Build Debug APK
        if: "${{ github.event_name == 'push' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}"
        run: ./gradlew assembleDebug --stacktrace --no-daemon --max-workers=2

      - name: Prepare APKs for Distribution
        run: |
          mkdir -p release-apks
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk release-apks/NexiPlay-v1.0.7-release.apk
          fi
          if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/debug/*.apk release-apks/NexiPlay-v1.0.7-debug.apk
          fi
          echo "Generated APKs:"
          ls -lh release-apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexiPlay-APKs
          path: release-apks/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "NexiPlay App v1.0.7"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
